title: >-
  Competitive USB-Powered Hand-Held Potentiostat for POC Applications: An HRP Detection Case
type: journal
pubYear: 2019
pubMonth: 12
pubDay: 6
doi: 10.3390/s19245388
journal: Sensors
authors:
