title: >-
  Self-Powered Adaptive Switched Architecture Storage
type: proceeding
pubYear: 2016
pubMonth: 12
pubDay: 6
doi: 10.1088/1742-6596/773/1/012103
journal: "Journal of Physics: Conference Series"
authors:
